# Render Web Service — BACKEND only
# Dashboard: Root Directory = (EMPTY / blank)
# Build Command: npm install
# Start Command: npm start

services:
  - type: web
    name: library-api
    runtime: node
    plan: free
    # Root Directory blank = repo root; postinstall installs backend/
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: USE_FILE_STORE
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_TEACHER_ID
        value: T001
      - key: DEFAULT_TEACHER_PASSWORD
        value: teacher123
      - key: DEFAULT_TEACHER_NAME
        value: Library Teacher
