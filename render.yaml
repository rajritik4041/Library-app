# Render Web Service — BACKEND only
# Dashboard: Root Directory = (EMPTY / blank)
# Build Command: npm install
# Start Command: npm start

services:
  - type: web
    name: library-api
    runtime: node
    plan: free
    # Root Directory blank = repo root; postinstall installs backend/
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Do NOT set USE_FILE_STORE=1 — MongoDB required for login/students/issues
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_TEACHER_ID
        value: T001
      - key: DEFAULT_TEACHER_PASSWORD
        value: teacher123
      - key: DEFAULT_TEACHER_NAME
        value: Library Teacher
      # Google Sheet ↔ MongoDB (same as Library/server/.env)
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_SHEET_DATA_START_ROW
        value: "3"
      - key: SHEET_SYNC_INTERVAL_MS
        value: "45000"
